name: task_habit_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  home_widget: ^0.7.0
  lottie: ^3.1.2
  image_picker: ^1.0.7
  # Cần cho zonedSchedule (hẹn thông báo theo múi giờ)
  timezone: ^0.9.4
  # Cần để copy ảnh nền vào thư mục dữ liệu lâu dài của app
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
